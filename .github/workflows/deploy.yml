name: Deploy to cPanel

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  deploy-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check cPanel SSH connectivity
        id: cpanel_ssh
        run: |
          echo "Checking TCP connectivity to ${CPANEL_HOST}:${CPANEL_PORT}"

          if nc -vz -w 20 "${CPANEL_HOST}" "${CPANEL_PORT}"; then
            echo "reachable=true" >> "${GITHUB_OUTPUT}"
            echo "cPanel SSH endpoint is reachable."
          else
            echo "reachable=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::cPanel SSH endpoint is not reachable from the GitHub runner. Test deploy will be skipped. Check CPANEL_HOST, CPANEL_PORT, SSH access, and hosting firewall allowlists."
          fi
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}

      - name: Deploy to test folder
        if: steps.cpanel_ssh.outputs.reachable == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          port: ${{ secrets.CPANEL_PORT }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          source: "index.php,config.php,db.php,functions.php,header.php,footer.php,sidebar.php,assets,clients,applications,financials,ratios,collateral,scoring,memos,committee,reports,logs,database"
          target: "/home/pubquest/public_html/risk.mindgames.md/test/"
          overwrite: true
          timeout: 120s

      - name: Explain skipped test deploy
        if: steps.cpanel_ssh.outputs.reachable == 'false'
        run: |
          echo "Test deploy was skipped because the cPanel SSH endpoint is unreachable from GitHub Actions."
          echo "The application build can still be reviewed in the PR, but the hosting firewall/SSH settings must be fixed before remote deployment can run."

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check cPanel SSH connectivity
        run: |
          echo "Checking TCP connectivity to ${CPANEL_HOST}:${CPANEL_PORT}"
          nc -vz -w 20 "${CPANEL_HOST}" "${CPANEL_PORT}"
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}

      - name: Deploy to production folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          port: ${{ secrets.CPANEL_PORT }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          source: "index.php,config.php,db.php,functions.php,header.php,footer.php,sidebar.php,assets,clients,applications,financials,ratios,collateral,scoring,memos,committee,reports,logs,database"
          target: "/home/pubquest/public_html/risk.mindgames.md/"
          overwrite: true
          timeout: 120s
